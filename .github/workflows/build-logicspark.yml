name: Build LogicSpark preview
on:
  push:
    branches: [logicspark]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logicspark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check logic and saved progress
        run: npm test
      - name: Install browser test dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Play all puzzles and test resume and small screens
        run: npm run test:ui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint Android
        run: |
          gradle --no-daemon wrapper --gradle-version 8.9
          ./gradlew --no-daemon lintDebug assembleDebug
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LogicSpark-v0.1.0-preview.apk
          sha256sum dist/LogicSpark-v0.1.0-preview.apk > dist/SHA256SUMS.txt
          zip -r dist/gradle-wrapper.zip gradle gradlew gradlew.bat
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: LogicSpark-v0.1.0-preview
          path: dist/
          retention-days: 30
      - name: Upload screenshots and lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LogicSpark-checks
          path: |
            test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LogicSpark-v0.1.0-preview
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable hardware acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Test the actual APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 test/android_smoke.py
      - name: Upload Android screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LogicSpark-device-checks
          path: device-results/
          if-no-files-found: ignore
          retention-days: 30
