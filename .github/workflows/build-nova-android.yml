name: Build Nova Store Android APK

on:
  push:
    branches:
      - nova-mobile-v1
    paths:
      - 'mobile/**'
      - '.github/workflows/build-nova-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Generate Android project
        env:
          CI: '1'
          EXPO_PUBLIC_API_URL: https://nova-store-icxo.onrender.com
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        env:
          EXPO_PUBLIC_API_URL: https://nova-store-icxo.onrender.com
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-store-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
