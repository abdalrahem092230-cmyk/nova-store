name: Nova Store Tests

on:
  push:
    branches:
      - main
    paths:
      - '*.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/nova-tests.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
