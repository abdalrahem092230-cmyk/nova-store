name: Diagnose Node syntax
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check admin-orders.js
      - run: node --check customer-account.js
      - run: node --check libya-locations.js
