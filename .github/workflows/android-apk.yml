name: Build Nova Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - nova-mobile-v1
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform android --non-interactive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NovaStore-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaStore-Android-APK
          path: mobile/NovaStore-debug.apk
          retention-days: 14
