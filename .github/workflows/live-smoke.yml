name: Nova Live Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        shell: bash
        run: |
          set -euo pipefail
          base="https://nova-store-icxo.onrender.com"
          for i in {1..30}; do
            body="$(curl -fsS --max-time 15 "$base/health" 2>/dev/null || true)"
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"storage":"postgres"'; then
              echo "Render is live with Postgres"
              exit 0
            fi
            echo "Waiting for Render deploy ($i/30)..."
            sleep 10
          done
          echo "Render did not become healthy in time"
          exit 1

      - name: Check public website and APIs
        shell: bash
        run: |
          set -euo pipefail
          base="https://nova-store-icxo.onrender.com"

          expect_status() {
            expected="$1"; shift
            actual="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 "$@")"
            echo "$* -> $actual"
            test "$actual" = "$expected"
          }

          expect_status 200 "$base/"
          expect_status 200 "$base/health"
          expect_status 200 "$base/account/login"
          expect_status 200 "$base/account/register"
          expect_status 302 "$base/account"
          expect_status 200 "$base/admin"
          expect_status 200 "$base/api/mobile/bootstrap"

          # Wrong credentials should be rejected, not report missing admin configuration.
          expect_status 401 -X POST             -H "content-type: application/x-www-form-urlencoded"             --data "email=smoke-test%40example.invalid&password=definitely-wrong"             "$base/admin/login"

          # Customer login endpoint should respond normally to invalid credentials.
          expect_status 401 -X POST             -H "content-type: application/x-www-form-urlencoded"             --data "phone=0929999999&password=definitely-wrong"             "$base/account/login"

      - name: Custom domain health
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 https://nova-store.l.cd/health || true)"
          echo "status=$code"
          cat /tmp/body || true
          test "$code" = "200"

      - name: Custom domain account page
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 https://nova-store.l.cd/account/login || true)"
          echo "status=$code"
          test "$code" = "200"

      - name: Custom domain admin page
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 https://nova-store.l.cd/admin/login || true)"
          echo "status=$code"
          test "$code" = "200"

      - name: Custom domain account POST
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 -X POST             -H "content-type: application/x-www-form-urlencoded"             --data "phone=0929999999&password=definitely-wrong"             https://nova-store.l.cd/account/login || true)"
          echo "status=$code"
          cat /tmp/body || true
          test "$code" = "401"

      - name: Custom domain admin POST
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 -X POST             -H "content-type: application/x-www-form-urlencoded"             --data "email=smoke-test%40example.invalid&password=definitely-wrong"             https://nova-store.l.cd/admin/login || true)"
          echo "status=$code"
          cat /tmp/body || true
          test "$code" = "401"

      - name: Browser-like Origin headers work on custom domain
        shell: bash
        run: |
          set -euo pipefail
          custom="https://nova-store.l.cd"

          code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 -X POST             -H "Origin: https://nova-store.l.cd"             -H "content-type: application/x-www-form-urlencoded"             --data "phone=0929999999&password=definitely-wrong"             "$custom/account/login")"
          echo "account browser-like POST -> $code"
          cat /tmp/body || true
          test "$code" = "401"

          code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 -X POST             -H "Origin: https://nova-store.l.cd"             -H "content-type: application/x-www-form-urlencoded"             --data "email=smoke-test%40example.invalid&password=definitely-wrong"             "$custom/admin/login")"
          echo "admin browser-like POST -> $code"
          cat /tmp/body || true
          test "$code" = "401"

      - name: Malformed stale cookies do not break login pages
        shell: bash
        run: |
          set -euo pipefail
          for base in "https://nova-store-icxo.onrender.com" "https://nova-store.l.cd"; do
            code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20               -H 'cookie: sid=%E0%A4%A; nova_customer=%ZZ'               "$base/admin/login")"
            echo "$base admin malformed cookie -> $code"
            test "$code" = "200"

            code="$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20               -H 'cookie: sid=%E0%A4%A; nova_customer=%ZZ'               "$base/account/login")"
            echo "$base account malformed cookie -> $code"
            test "$code" = "200"
          done

      - name: Production render diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for base in "https://nova-store-icxo.onrender.com" "https://nova-store.l.cd"; do
            body="$(curl -fsS --max-time 20 "$base/health/render")"
            echo "$base -> $body"
            echo "$body" | grep -q '"ok":true'
            echo "$body" | grep -q '"adminOrders":true'
            echo "$body" | grep -q '"accounts":true'
          done

      - name: Check health payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://nova-store-icxo.onrender.com/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"storage":"postgres"' /tmp/health.json
          grep -q '"accountSessions":"signed"' /tmp/health.json
          grep -q '"adminSessions":"signed"' /tmp/health.json
          build="$(python -c "import json; print(json.load(open('/tmp/health.json')).get('build',''))")"
          expected="${GITHUB_SHA:0:12}"
          echo "reported build=$build expected=$expected"
          test "$build" = "$expected"
